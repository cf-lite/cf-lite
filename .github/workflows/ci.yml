name: ci
on:
  push:
    branches: [main]
    paths-ignore: [".github/ISSUE_TEMPLATE/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: [".github/ISSUE_TEMPLATE/**"]
  # Node 22 support check (Node-only e2e job): weekly, ubuntu only (never on PR/push; no macOS: ~10x Actions minutes). Mondays 03:17 UTC.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
# One run per PR (or per ref on push). PR runs are superseded by a newer push; runs on main are
# never cancelled mid-way (a half-finished main run would leave the ratchet/size budget unchecked).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Docs-only changes (*.md, docs/**) skip the heavy job and run a cheap docs lint instead, so
  # this workflow still reports success on them. Draft PRs skip everything until ready_for_review.
  changes:
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then range="$BEFORE..HEAD"
          else range=""; fi
          if [ -z "$range" ] || ! files=$(git diff --name-only "$range" 2>/dev/null); then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$files"
          if echo "$files" | grep -vqE '(^docs/|\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build && bun install --frozen-lockfile
      - name: Docs links and anchors
        run: bun run docs:check && bun run llms:check
      - name: Docs snippets typecheck
        run: bun run docs:snippets

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      # Bun is the toolchain; Node 24 stays only for what Miniflare needs (vite dev / wrangler dev / coverage), see docs/bun-first.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build packages and link bins
        # the install runs before dist/ exists, so the workspace `cf-lite` bin link is missing until a second install
        run: bun run build && bun install --frozen-lockfile
      - name: Docs links and anchors
        run: bun run docs:check && bun run llms:check
      - name: Docs snippets typecheck (```ts check fences)
        run: bun run docs:snippets
      - name: Typecheck (all packages + example apps)
        run: bun run typecheck
      - name: Unit tests under Bun (vitest, the two wrangler-dev files run in the coverage step)
        run: bun --bun vitest run --exclude '**/*-workerd.test.ts'
      - name: Coverage ratchet (vitest on Node, v8 coverage crashes under Bun) + workerd-spawning tests
        run: node node_modules/vitest/vitest.mjs run --coverage
      - name: Worker size budget (bench/module-sizes.json)
        run: bun scripts/size-budget.mjs
      # before test:e2e: scripts/rsc-e2e.mjs launches chromium (missing browser failed every main run since #38)
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: e2e under local workerd (demo, adapter apps, scaffolds)
        run: bun run test:e2e
      - name: Dev-server e2e (vite dev)
        run: bun run test:dev
      - name: Browser tests (Playwright chromium)
        run: bun run test:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  # Weekly Node 22 job (schedule / manual dispatch only): the PR/push job above stays on Bun + Node 24.
  node22:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build && bun install --frozen-lockfile
      - name: Typecheck (all packages + example apps)
        run: bun run typecheck
      - name: Unit tests (vitest on Node 22)
        run: node node_modules/vitest/vitest.mjs run
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: e2e under local workerd
        run: bun run test:e2e
      - name: Dev-server e2e (vite dev)
        run: bun run test:dev
