# cf-lite preview per PR: uploads a *version* (no production traffic) under the alias pr-<n> and comments the URL.
# Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID. wrangler.jsonc must define env.preview with its OWN
# D1/KV/R2 ids (cf-lite deploy refuses a preview that reuses production resources).
name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # forks have no access to secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - id: up
        run: |
          bunx cf-lite deploy --env preview --preview-alias pr-${{ github.event.pull_request.number }} | tee out.txt
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' out.txt | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.up.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview: ${{ steps.up.outputs.url }}\n\n_noindex; uses the \`preview\` environment bindings only._`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = data.find((c) => c.body.startsWith("Preview: "));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
